version = 1

# Default for all files
# It is preferrable to use per-file annotations, which will override these entries
[[annotations]]
path = [
    # source and test code. Can be overridden on a per-file basis inside the file itself (which will supercede this)
    "src/**/*.ts",
    "test/**/*.ts",
    "src/**/*.json",
    "test/**/*.json",
    "src/**/*.jsonc",
    "global.d.ts",
    "plugins/**/*",
    # HTML / CSS at the top level, or in `tests`
    "*.html",
    "*.css",
    "test/**/*.html",
    "test/**/*.css",
    # Config files
    ".dependency-cruiser.cjs",
    # Json files that can't be commented
    "package.json",
    "tsconfig.json",
    "tsdoc.json",
    "typedoc.json",
    # environment files
    ".env",
    ".env.*",
    # Development files considered code
    ".vscode/*.json",
]
SPDX-FileCopyrightText = "2024-2025 Pagefault Games"
SPDX-License-Identifier = "AGPL-3.0-only"

# Files with no copyright
[[annotations]]
path = [
    # Git files
    "**/*.gitignore",
    "**/*.gitmodules",
    "**/*.gitattributes",
    "**/*.dockerignore",
    # Configuration files
    ".editorconfig",
    ".vscode/**/*.json",
    # any pokerogue save files for tests
    "**/*.prsv",
    # pnpm related files of insignificant originality
    "package-lock.json",
    "pnpm-lock.yaml",
    "pnpm-workspace.yaml",
    # Miscellaneous files of insignificant originality
    ".nvmrc",
    "RELEASE",
    # patch files for broken packages
    "patches/*.patch"
]
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileCopyrightText = "NONE"

[[annotations]]
path = "favicon.ico"                        # Created by Gonstar (Paid Commission)
SPDX-FileCopyrightText = "2024 Gonstar"
SPDX-License-Identifier = "CC-BY-NC-SA-4.0"

# ── 블서로그 ──
# 이터널 리턴 리소스: 님블뉴런 저작물, AGPL 적용 안 됨
[[annotations]]
path = ["assets/er/**"]
precedence = "override"
SPDX-FileCopyrightText = "Nimble Neuron"
SPDX-License-Identifier = "LicenseRef-NimbleNeuron"

[[annotations]]
path = ["docs/기획.md", "scripts/er-data/**", "assets/README.md", "locales/README.md"]
SPDX-FileCopyrightText = "2026 SG"
SPDX-License-Identifier = "AGPL-3.0-only"

# 임시 그림 · 소리 (scripts/placeholder-assets/make.py 가 새로 그린 것) + 포켓로그 assets 에서
# AGPL-3.0 · CC0 로 적힌 JSON(기술 연출 · 색 목록 등)만 그대로 가져온 것
[[annotations]]
path = ["assets/**"]
SPDX-FileCopyrightText = ["2024-2026 Pagefault Games", "2026 SG"]
SPDX-License-Identifier = "AGPL-3.0-only"

# 갈무리 글꼴 (나중에 이터널 리턴 공식 글꼴로 바꿔요)
[[annotations]]
path = ["assets/fonts/Galmuri*"]
precedence = "override"
SPDX-FileCopyrightText = "2019-2025 Lee Minseo (quiple)"
SPDX-License-Identifier = "OFL-1.1"

# 한국어 글자: 포켓로그 번역 저장소(pokerogue-locales, AGPL-3.0) ko 를 바탕으로 블서로그에 맞게 고쳐 써요
[[annotations]]
path = ["locales/ko/**"]
SPDX-FileCopyrightText = ["2024-2026 Pagefault Games", "2026 SG"]
SPDX-License-Identifier = "AGPL-3.0-only"
